version: "3.8"

networks:
  net-kafka:
    driver: bridge

services:
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    restart: always

    ports:
      - "9092:9094"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - net-kafka

    volumes:
      - kafka_data:/var/lib/kafka/data

  consumidor:
    image: tobiasrafaelrosa/kafka-fila-consumidor:latest
    container_name: consumidor
    restart: always
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: fila-pedidos
    networks:
      - net-kafka

  produtor:
    image: tobiasrafaelrosa/kafka-fila-produtor:latest
    container_name: produtor
    restart: on-failure
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: fila-pedidos
    networks:
      - net-kafka

volumes:
  kafka_data:
